name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: teams
          POSTGRES_PASSWORD: teams
          POSTGRES_DB: teams_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teams"
          --health-interval 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://teams:teams@localhost/teams_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: kubectl kustomize deploy/k8s > /dev/null

  image:
    needs: [test, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: ${{ github.repository }}
            context: .
          - name: ${{ github.repository }}-backup
            context: deploy/backup
    steps:
      - uses: actions/checkout@v4
      # Lets x86 runners build Arm images, so one image works on either kind of VM.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ matrix.name }}
          tags: |
            type=raw,value=main
            type=sha,format=short
      # Pull requests build the images to prove they work, but only main publishes them.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
