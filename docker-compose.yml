# Local testing only. The passwords here are not secrets.
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://teams:teams@db/teams
  SESSION_SECRET: local-development-only-not-a-real-secret
  RATING_SECRET: local-development-only-not-a-real-secret
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
  SECURE_COOKIES: "false"
  LOG_EMAILS: "true"
  DEMO_MODE: "true"
  SITE_THEME: ${SITE_THEME:-midnight}

services:
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: teams
      POSTGRES_PASSWORD: teams
      POSTGRES_DB: teams
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teams"]
      interval: 3s
      retries: 20

  migrate:
    build: .
    command: ["sh", "-c", "alembic upgrade head && python -m app.demo"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    ports:
      - "8000:8000"
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
