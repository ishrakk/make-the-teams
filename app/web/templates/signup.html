{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<h1>Sign up</h1>
<form method="post" action="/signup" class="stack">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" required autofocus>
  <label for="password">Password (at least {{ min_length }} characters)</label>
  <input id="password" name="password" type="password" autocomplete="new-password" minlength="{{ min_length }}" required>
  <button class="button button-primary">Sign up</button>
</form>
<p class="muted">Already have an account? <a href="/login">Log in</a>.</p>
{% endblock %}
