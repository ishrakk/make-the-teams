<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c5a38">
  <title>{% block title %}Make the Teams{% endblock %}</title>
  <link rel="preload" href="/static/fonts/barlow-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% if signed_in %}
  <nav class="nav" aria-label="Main">
    <a href="/">This week</a>
    <a href="/players">Players</a>
    <form method="post" action="/logout"><button class="link-button">Sign out</button></form>
  </nav>
  {% endif %}
  <main>
    {% if message %}<p class="notice" role="status">{{ message }}</p>{% endif %}
    {% if error %}<p class="notice notice-error" role="alert">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
