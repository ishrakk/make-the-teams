{% extends "base.html" %}
{% block title %}Account{% endblock %}
{% block content %}
<h1>Account</h1>
<p>Signed in as <strong>{{ user.email }}</strong></p>
<p><a href="/groups">Your groups</a></p>
<form method="post" action="/logout"><button class="button">Log out</button></form>

<h2>Change password</h2>
<form method="post" action="/account/password" class="stack">
  <label for="current_password">Current password</label>
  <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
  <label for="new_password">New password (at least {{ min_length }} characters)</label>
  <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="{{ min_length }}" required>
  <button class="button">Change password</button>
</form>

<h2>Delete account</h2>
<p>This permanently removes your account, your place in every group and the ratings you gave and received.</p>
<form method="post" action="/account/delete" class="stack">
  <label for="delete_password">Enter your password to confirm</label>
  <input id="delete_password" name="password" type="password" autocomplete="current-password" required>
  <button class="button button-danger">Delete account</button>
</form>
{% endblock %}
