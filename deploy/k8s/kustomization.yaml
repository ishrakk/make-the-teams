apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: make-the-teams
resources:
  - namespace.yaml
  - postgres.yaml
  - web.yaml
  - ingress.yaml
  - cluster-issuer.yaml
  - backup.yaml
  - monitoring/prometheus.yaml
  - monitoring/node-exporter.yaml
  - monitoring/grafana.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=monitoring/prometheus.yml
  - name: grafana-provisioning
    files:
      - datasource.yml=monitoring/grafana-datasource.yml
      - dashboards.yml=monitoring/grafana-dashboards.yml
  - name: grafana-dashboard
    files:
      - make-the-teams.json=monitoring/make-the-teams-dashboard.json
images:
  - name: ghcr.io/ishrakk/make-the-teams
    newTag: main # Pin to a commit tag (sha-xxxxxxx) for repeatable deploys.
  - name: ghcr.io/ishrakk/make-the-teams-backup
    newTag: main
