apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  # k3s includes Traefik. Replace teams.example.com below with your domain.
  ingressClassName: traefik
  tls:
    - hosts:
        - teams.example.com
      secretName: make-the-teams-tls
  rules:
    - host: teams.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
